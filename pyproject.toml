# File guide.
# Use: Defines the Python package, dependencies, and tool settings.
# Usage: uv, build tools, Ruff, Black, and pytest read this file.
# Duties: Keeps project metadata, dependency groups, and test/lint config.
# Depends on: README.md, LICENSE, src/rastin_ai, and uv.lock.

[project]
name = "Rastin-AI"
version = "0.1.0"
description = "An open-source AI orchestration framework for building agentic applications and workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "azure-identity",
    "azure-storage-blob",
    "fastapi",
    "langfuse>=4.14.1",
    "langchain",
    "langgraph",
    "openpyxl",
    "pypdf",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "python-docx",
    "openai",
    "PyJWT[crypto]>=2.10.0",
    "qdrant-client",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn",
    "aiohttp>=3.14.3",
]

[project.urls]
Homepage = "https://github.com/AmirYarmhmdi/Rastin-AI"
Repository = "https://github.com/AmirYarmhmdi/Rastin-AI"
Issues = "https://github.com/AmirYarmhmdi/Rastin-AI/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "black",
    "httpx",
    "pre-commit",
    "pytest",
    "ruff",
]
evaluation = [
    "deepeval>=3.0.0",
    "langchain-community<0.4.0",
    "ragas>=0.3.0",
]


[tool.black]
line-length = 88
target-version = ["py312"]


[tool.ruff]
line-length = 88
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.hatch.build.targets.wheel]
packages = ["src/rastin_ai"]

[tool.hatch.build.targets.sdist]
exclude = ["/*.backup.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "evaluation: LLM-backed evaluation tests that require evaluator dependencies and credentials",
    "e2e: isolated end-to-end tests requiring disposable PostgreSQL and Qdrant services",
]
